<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Данж Пуджинио</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stone:#2a2622; --stone-dark:#17140f; --stone-light:#3d3630; --mortar:#0c0a08;
    --gold:#d8a838; --gold-dim:#8a6a22; --parch:#e6d3a3; --parch-dark:#c9b27e; --ink:#2b1d0e;
    --hp:#c62e2e; --hp-dark:#5a1414; --enemy:#8b3fb8; --enemy-dark:#3a1a4d; --ok:#5aa85a; --torch:#ff9a2e;
    --fg:#eee3cc; --hint:#a3967f;
    --pixel:'Press Start 2P', monospace; --body:'Rubik', -apple-system, 'Segoe UI', Roboto, sans-serif;
    --sat: var(--tg-content-safe-area-inset-top, 0px); --sab: var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
    --vh: var(--tg-viewport-stable-height, 100dvh);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{
    color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.4;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,150,40,.10), transparent 55%),
      repeating-linear-gradient(0deg, var(--mortar) 0 2px, transparent 2px 46px),
      repeating-linear-gradient(90deg, var(--mortar) 0 2px, transparent 2px 92px),
      linear-gradient(180deg, #221e19, #15120e);
    touch-action:none;
  }
  body::before{ content:''; position:fixed; inset:0; pointer-events:none; opacity:.35; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.45 0 0 0 0 0.4 0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  body::after{ content:''; position:fixed; inset:0; pointer-events:none; z-index:1;
    background:radial-gradient(ellipse at 50% 40%, transparent 50%, rgba(0,0,0,.7) 100%); }

  /* ── the whole game is one screen: no page scroll ── */
  .app{ position:relative; z-index:2; height:var(--vh); max-width:560px; margin:0 auto; display:flex; flex-direction:column;
        padding: calc(var(--sat) + 8px) 12px calc(var(--sab) + 10px); gap:8px; }

  /* top bar: room + corridor + chronicle button */
  .top{ display:flex; align-items:center; gap:8px; }
  .top .roomno{ font-family:var(--pixel); font-size:9px; color:var(--gold); white-space:nowrap; text-shadow:1px 1px 0 #000; }
  .map{ flex:1; display:flex; gap:3px; padding:4px; background:var(--stone-dark); border:2px solid #000; border-radius:4px; box-shadow: inset 0 0 0 1px var(--stone-light); }
  .map span{ flex:1; height:16px; display:flex; align-items:center; justify-content:center; font-size:10px; background:linear-gradient(180deg, var(--stone-light), var(--stone)); border:1px solid #000; border-radius:2px; color:#5a5148; }
  .map span.done{ background:linear-gradient(180deg,#3e5a3a,#2b3f28); color:#dfe8d0; }
  .map span.current{ background:linear-gradient(180deg,#8a6a22,#5e4614); color:#fff; box-shadow:0 0 8px rgba(216,168,56,.7); }
  .map span.boss{ border-color:var(--gold-dim); }
  .rule{ font-size:12.5px; color:var(--hint); text-align:center; margin-top:-4px; }
  .rule b{ color:var(--gold); font-family:var(--pixel); font-size:8px; margin-right:6px; }
  .iconbtn{ width:38px; height:32px; border:2px solid #000; border-radius:4px; background:linear-gradient(180deg,#5a4f43,#3a322b 60%,#2a241f); color:var(--fg); font-size:16px; box-shadow:0 2px 0 #000; }

  .slab{ background:linear-gradient(180deg, var(--stone-light), var(--stone) 30%, var(--stone-dark)); border:2px solid #000; border-radius:6px;
         box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -2px 0 rgba(0,0,0,.6), 0 3px 0 #000; }

  /* enemy panel — top, next to the enemy (Pokémon layout) */
  .enemy{ padding:8px 12px; display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center; position:relative; }
  .enemy .name{ font-weight:700; font-size:15px; text-shadow:1px 1px 0 #000; }
  .enemy .atk{ font-family:var(--pixel); font-size:8px; color:var(--hint); }
  .enemy .bar{ grid-column:1 / -1; }

  .bar{ position:relative; height:18px; background:var(--hp-dark); border:2px solid #000; border-radius:3px; overflow:hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,.7); }
  .bar i{ position:absolute; left:0; top:0; bottom:0; background:linear-gradient(180deg,#e04646,var(--hp) 50%,#8d1e1e); transition:width .4s ease; }
  .bar i::after{ content:''; position:absolute; inset:0; background:repeating-linear-gradient(90deg, transparent 0 9px, rgba(0,0,0,.25) 9px 10px); }
  .bar.en{ background:var(--enemy-dark); } .bar.en i{ background:linear-gradient(180deg,#b06be0,var(--enemy) 50%,#5a2a7a); }
  .bar b{ position:absolute; inset:0; font-family:var(--pixel); font-size:8px; line-height:14px; text-align:center; color:#fff; text-shadow:1px 1px 0 #000; }

  /* stage — takes whatever height is left, sprite scales into it */
  .stage{ flex:1 1 0; min-height:90px; display:flex; align-items:center; justify-content:center; position:relative; }
  .stage img{ height:100%; max-height:100%; max-width:70%; aspect-ratio:1; object-fit:cover; image-rendering:pixelated; border:3px solid #000; border-radius:6px;
              box-shadow: 0 0 0 2px var(--gold-dim), 0 10px 20px rgba(0,0,0,.7); animation:idle 3s ease-in-out infinite; background:#0f0d0a; }
  .stage img.hurt{ animation:hurt .4s; }
  .stage .emoji{ font-size:min(22vh, 96px); filter:drop-shadow(0 6px 10px rgba(0,0,0,.8)); animation:idle 3s ease-in-out infinite; }
  .stage .title{ position:absolute; left:0; right:0; bottom:-2px; text-align:center; font-family:var(--pixel); font-size:9px; color:var(--gold); text-shadow:2px 2px 0 #000; pointer-events:none; }
  @keyframes idle{ 50%{ transform:translateY(-4px) } }
  @keyframes hurt{ 0%,100%{ filter:none; transform:none } 30%{ filter:brightness(2.2) saturate(0) sepia(1) hue-rotate(-50deg) saturate(6); transform:translateX(-6px) } 60%{ transform:translateX(6px) } }

  /* message box — room text (if any) + last events; scrolls inside if long */
  .msg{ flex:0 1 auto; max-height:34vh; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; overscroll-behavior:contain;
        padding:10px 12px; background:#0b0907; border:3px double var(--gold-dim); border-radius:4px; box-shadow: inset 0 0 14px rgba(0,0,0,.9); position:relative; font-size:15px; }
  .msg .text{ color:var(--parch); margin-bottom:8px; padding-bottom:8px; white-space:pre-wrap; border-bottom:1px solid rgba(238,227,204,.35); }
  .msg .ev{ padding:2px 0; color:var(--hint); }
  .msg .ev.new{ color:var(--fg); animation:slidein .25s ease-out; }
  .msg .cur{ position:sticky; float:right; bottom:0; font-size:10px; color:var(--gold); animation:blink 1s steps(1) infinite; }
  @keyframes slidein{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:none } }
  @keyframes blink{ 50%{ opacity:0 } }

  /* player panel — right above the buttons */
  .me{ padding:8px 12px; display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center; position:relative; }
  .me .chips{ display:flex; gap:10px; font-family:var(--pixel); font-size:9px; white-space:nowrap; text-shadow:1px 1px 0 #000; }
  .me .chips .g{ color:var(--gold); }
  .me .bar{ grid-column:1 / -1; }
  .me .stat{ grid-column:1 / -1; font-size:12.5px; color:var(--hint); }

  /* actions — thumb zone */
  .actions{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .btn{ min-height:52px; padding:8px 10px; border:2px solid #000; border-radius:5px; color:#fff; font-family:var(--body); font-weight:700; font-size:15px; line-height:1.2;
        background:linear-gradient(180deg,#5a4f43,#3a322b 60%,#2a241f); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 3px 0 #000; text-shadow:1px 1px 0 #000; }
  .btn small{ display:block; font-weight:400; font-size:12px; opacity:.85; }
  .btn:active{ transform:translateY(3px); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 0 0 #000; }
  .btn:disabled{ opacity:.35; } .btn.busy{ opacity:.6; } .btn.wide{ grid-column:1 / -1; }
  .btn.red{ background:linear-gradient(180deg,#a83a3a,#6b1f1f 60%,#4a1414); } .btn.blue{ background:linear-gradient(180deg,#3f5f8a,#28405f 60%,#1b2c44); }
  .btn.gold{ background:linear-gradient(180deg,#c9a03a,#8a6a22 60%,#5e4614); } .btn.green{ background:linear-gradient(180deg,#4f8a45,#2f5a2a 60%,#1f3d1b); }
  .btn.purple{ background:linear-gradient(180deg,#7a4a9a,#4a2a62 60%,#2e1a40); }

  /* end screen replaces stage+msg */
  .end{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:12px; gap:6px; overflow-y:auto; }
  .end .big{ font-size:64px; filter:drop-shadow(0 6px 10px rgba(0,0,0,.8)); }
  .end h2{ font-family:var(--pixel); font-size:11px; margin:0; color:var(--gold); text-shadow:2px 2px 0 #000; line-height:1.8; }
  .end .others{ text-align:left; font-size:14px; line-height:1.7; }
  .end .boss{ font-family:var(--pixel); font-size:8px; color:var(--hint); line-height:1.8; }

  /* chronicle sheet */
  .sheet{ position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.6); display:none; }
  .sheet.open{ display:block; }
  .sheet .panel{ position:absolute; left:0; right:0; bottom:0; max-height:75%; display:flex; flex-direction:column; padding:12px 14px calc(var(--sab) + 12px);
                 background:linear-gradient(180deg, var(--stone-light), var(--stone) 20%, var(--stone-dark)); border-top:3px solid #000; border-radius:10px 10px 0 0; }
  .sheet .t{ font-family:var(--pixel); font-size:9px; color:var(--gold); margin-bottom:8px; display:flex; justify-content:space-between; }
  .sheet .list{ overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; font-size:14px; }
  .sheet .list div{ padding:4px 0; border-bottom:1px solid rgba(255,255,255,.06); color:var(--hint); }
  .sheet .list div:last-child{ color:var(--fg); }

  .pop{ position:absolute; left:50%; top:-8px; transform:translateX(-50%); font-family:var(--pixel); font-size:12px; pointer-events:none; text-shadow:2px 2px 0 #000; animation:pop 1s ease-out forwards; z-index:3; }
  .pop.dmg{ color:#ff6b6b; } .pop.heal{ color:#7ee08a; } .pop.crit{ color:var(--gold); font-size:15px; }
  @keyframes pop{ 0%{ opacity:0; transform:translate(-50%, 6px) } 15%{ opacity:1 } 100%{ opacity:0; transform:translate(-50%, -34px) } }
  .flash{ position:fixed; inset:0; z-index:4; pointer-events:none; opacity:0; transition:opacity .35s; }
  .flash.hit{ background:radial-gradient(ellipse, transparent 40%, rgba(200,30,30,.55)); opacity:1; transition:none; }
  .flash.heal{ background:radial-gradient(ellipse, transparent 40%, rgba(60,180,80,.45)); opacity:1; transition:none; }
  .shake{ animation:shake .35s; } @keyframes shake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
  .hidden{ display:none !important; }

  /* ── intro: torches ignite, title types out, then the gates part ── */
  .intro{ position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px;
          background:#000; overflow:hidden; }
  .intro .half{ position:absolute; top:0; bottom:0; width:50.5%; background:
      repeating-linear-gradient(0deg, var(--mortar) 0 2px, transparent 2px 46px), repeating-linear-gradient(90deg, var(--mortar) 0 2px, transparent 2px 92px),
      linear-gradient(180deg, #221e19, #15120e); box-shadow: inset 0 0 60px rgba(0,0,0,.9); transition:transform 1.1s cubic-bezier(.7,0,.3,1); }
  .intro .half.l{ left:0; border-right:4px solid #000; } .intro .half.r{ right:0; border-left:4px solid #000; }
  .intro .half.l::after,.intro .half.r::after{ content:''; position:absolute; top:50%; width:18px; height:18px; border-radius:50%; background:radial-gradient(circle,#d8a838,#5e4614); box-shadow:0 0 8px #000; transform:translateY(-50%); }
  .intro .half.l::after{ right:10px; } .intro .half.r::after{ left:10px; }
  .intro.open .half.l{ transform:translateX(-102%); } .intro.open .half.r{ transform:translateX(102%); }
  .intro.open .content{ opacity:0; transition:opacity .5s; }
  .intro .content{ position:relative; z-index:2; max-width:420px; }
  .intro .torches{ display:flex; justify-content:center; gap:70px; font-size:40px; margin-bottom:26px; }
  .intro .torches span{ opacity:0; transform:scale(.2); filter:drop-shadow(0 0 14px var(--torch)); animation:ignite .7s ease-out forwards, flicker 1.6s .7s infinite; }
  .intro .torches span:nth-child(2){ animation-delay:.35s, 1.05s; }
  @keyframes ignite{ to{ opacity:1; transform:scale(1) } }
  @keyframes flicker{ 0%,100%{ transform:scale(1) rotate(-2deg) } 30%{ transform:scale(1.08) rotate(2deg); opacity:.85 } 60%{ transform:scale(.96) rotate(-1deg) } }
  .intro h1{ font-family:var(--pixel); font-size:17px; line-height:1.8; letter-spacing:2px; color:var(--gold); text-shadow:0 0 16px rgba(216,168,56,.6), 3px 3px 0 #000; margin:0 0 18px; min-height:60px; }
  .intro h1 .c{ opacity:0; animation:appear .05s forwards; }
  @keyframes appear{ to{ opacity:1 } }
  .intro .line{ font-size:16px; color:var(--fg); opacity:0; margin:8px 0; transform:translateY(8px); transition:opacity .8s, transform .8s; }
  .intro .line.on{ opacity:1; transform:none; }
  .intro .line.date{ font-family:var(--pixel); font-size:9px; color:var(--hint); margin-top:16px; }
  .intro .tap{ margin-top:34px; font-family:var(--pixel); font-size:8px; color:var(--gold-dim); opacity:0; transition:opacity .8s; animation:blink 1.2s steps(1) infinite; }
  .intro .tap.on{ opacity:1; }
  .err{ color:var(--fg); text-align:center; padding:60px 16px; font-family:var(--pixel); font-size:9px; line-height:2; }
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<div class="intro hidden" id="intro">
  <div class="half l"></div><div class="half r"></div>
  <div class="content">
    <div class="torches"><span>🔥</span><span>🔥</span></div>
    <h1 id="introTitle"></h1>
    <div class="line" id="il1">Каменные ступени уходят во тьму.</div>
    <div class="line" id="il2">Из глубины пахнет сыростью и дешёвым пивом.</div>
    <div class="line" id="il3">Десять комнат. Один заход в день. В конце — Мини-Пуджик.</div>
    <div class="line date" id="il4"></div>
    <div class="tap" id="itap">КОСНИСЬ, ЧТОБЫ СПУСТИТЬСЯ</div>
  </div>
</div>
<div class="app" id="app">
  <div class="top">
    <span class="roomno" id="roomno">КОМНАТА 1/10</span>
    <div class="map" id="map"></div>
    <button class="iconbtn" id="logbtn" aria-label="Хроника">📜</button>
  </div>
  <div class="rule hidden" id="rule"></div>
  <div class="slab enemy hidden" id="enemy"></div>
  <div class="stage" id="stage"></div>
  <div class="msg" id="msg"></div>
  <div class="end hidden" id="end"></div>
  <div class="slab me" id="me"></div>
  <div class="actions" id="actions"></div>
</div>
<div class="sheet" id="sheet"><div class="panel"><div class="t"><span>ХРОНИКА</span><span id="closesheet">✕</span></div><div class="list" id="loglist"></div></div></div>

<script>
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#17140f'); tg.setBackgroundColor('#17140f'); } catch(e){}
            try { tg.disableVerticalSwipes(); } catch(e){} }
  const initData = (tg && tg.initData) || '';
  const $ = id => document.getElementById(id);
  let busy = false, lastHp = null, lastEnemyHp = null, lastLogLen = 0, lastRoom = null, fullLog = [];

  const TYPE_ICON = {fight:'⚔️', boss:'🗿', riddle:'🧩', puzzle:'🧩', npc:'👻', treasure:'💰', trap:'⚠️', rest:'🔥', merchant:'🎩'};
  const BTN_CLASS = id => id === 'attack' ? 'red' : id === 'defend' ? 'blue' : id === 'special' ? 'gold' : (id === 'potion' || id === 'rest') ? 'green'
                        : id === 'next' ? 'gold wide' : id === 'leave' ? 'wide' : id.startsWith('buy:') ? 'purple' : '';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // "🛡️ Блок: урон по вам ÷2, удар 2" → main label + small detail so buttons stay readable
  function btnLabel(l){
    let main = l, sub = '';
    const c = l.indexOf(': ');
    if (c > 0) { main = l.slice(0, c); sub = l.slice(c + 2); }
    else if (/\)$/.test(l) && l.lastIndexOf(' (') > 0) { const i = l.lastIndexOf(' ('); main = l.slice(0, i); sub = l.slice(i + 2, -1); }
    else { const d = l.indexOf(' — '); if (d > 0) { main = l.slice(0, d); sub = l.slice(d + 3); } }
    return sub ? `${esc(main)}<small>${esc(sub)}</small>` : esc(l);
  }
  function flash(kind){ const f = $('flash'); f.className = 'flash ' + kind; setTimeout(() => { f.className = 'flash'; }, 60); }
  function pop(host, text, cls){ if (!host) return; const el = document.createElement('div'); el.className = 'pop ' + cls; el.textContent = text; host.appendChild(el); setTimeout(() => el.remove(), 1000); }

  $('logbtn').addEventListener('click', () => { $('loglist').innerHTML = fullLog.map(l => `<div>${esc(l)}</div>`).join('') || '<div>Пока пусто.</div>'; $('sheet').classList.add('open'); const L = $('loglist'); L.scrollTop = L.scrollHeight; });
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet') || e.target.id === 'closesheet') $('sheet').classList.remove('open'); });

  function render(payload){
    const v = payload.view, p = v.player, r = v.room;
    const roomKey = r.number + ':' + r.type;
    if (roomKey !== lastRoom) { lastRoom = roomKey; lastEnemyHp = null; lastLogLen = 0; }
    const log = v.log || []; fullLog = v.chronicle || log;
    const fresh = Math.max(0, log.length - lastLogLen);

    $('roomno').textContent = `КОМНАТА ${r.number}/${v.rooms_total}`;
    if (v.modifier && v.modifier.key && v.modifier.key !== 'none') { $('rule').innerHTML = `<b>ПРАВИЛО ДНЯ</b>${esc(v.modifier.name)} — ${esc(v.modifier.desc)}`; $('rule').classList.remove('hidden'); }
    else $('rule').classList.add('hidden');
    $('map').innerHTML = v.map.map((m,i) => `<span class="${m.done ? 'done' : ''}${m.current ? ' current' : ''}${i === 9 ? ' boss' : ''}">${(m.done || m.current || i === 9) ? (TYPE_ICON[m.type] || '❔') : '·'}</span>`).join('');

    // enemy panel
    const en = $('enemy');
    if (r.enemy) {
      const ep = Math.round(100 * r.enemy.hp / r.enemy.max_hp);
      const hid = r.enemy.hidden_hp;
      en.innerHTML = `<div class="name">${esc(r.enemy.name)}</div><div class="atk">АТК ${r.enemy.atk}</div>
        <div class="bar en"><i style="width:${hid ? 100 : ep}%; ${hid ? 'filter:grayscale(1) brightness(.6)' : ''}"></i><b>${hid ? '??? / ???' : r.enemy.hp + '/' + r.enemy.max_hp}</b></div>`;
      en.classList.remove('hidden');
      if (lastEnemyHp !== null && r.enemy.hp < lastEnemyHp) {
        pop(en, hid ? '-?' : '-' + (lastEnemyHp - r.enemy.hp), /КРИТ/.test(log.slice(-3).join(' ')) ? 'crit' : 'dmg');
        const sp = $('stage').querySelector('img'); if (sp) { sp.classList.add('hurt'); setTimeout(() => sp.classList.remove('hurt'), 400); }
      }
      lastEnemyHp = r.enemy.hp;
    } else { en.classList.add('hidden'); en.innerHTML = ''; }

    // stage
    $('stage').innerHTML = (r.image ? `<img src="${esc(r.image)}" alt="">` : `<div class="emoji">${r.emoji || TYPE_ICON[r.type] || '❔'}</div>`)
      + (r.enemy ? '' : `<div class="title">${esc(r.title || '')}</div>`);

    // message box: room text for non-fights + last events
    const show = log.slice(-3), nNew = Math.min(Math.max(fresh, 1), show.length);
    let m = '';
    if (r.text && r.type !== 'fight' && r.type !== 'boss') m += `<div class="text">${esc(r.text)}</div>`;
    m += show.map((l, i) => `<div class="ev ${i >= show.length - nNew ? 'new' : ''}">${esc(l)}</div>`).join('');
    if (r.hint) m += `<div class="text">${esc(r.hint)}</div>`;
    if (r.warning) m += `<div class="text" role="status">${esc(r.warning)}</div>`;
    m += `<span class="cur">▼</span>`;
    $('msg').innerHTML = m; $('msg').scrollTop = $('msg').scrollHeight;
    lastLogLen = log.length;

    // player panel
    const hpPct = Math.round(100 * p.hp / p.max_hp);
    $('me').innerHTML = `<div class="chips"><span>❤ ${p.hp}/${p.max_hp}</span><span class="g">◈ ${p.gold}</span><span>⚗ ${p.potions}</span>${p.shield ? '<span>🛡</span>' : ''}</div><div></div>
      <div class="bar"><i style="width:${hpPct}%"></i><b>HP ${p.hp}/${p.max_hp}</b></div><div class="stat">${esc(v.stats_line || '')}</div>`;
    if (lastHp !== null && p.hp < lastHp) { flash('hit'); $('app').classList.remove('shake'); void $('app').offsetWidth; $('app').classList.add('shake'); if (tg) try{ tg.HapticFeedback.impactOccurred('heavy'); }catch(e){} }
    if (lastHp !== null && p.hp > lastHp) flash('heal');
    if (lastHp !== null && p.hp !== lastHp) pop($('me'), (p.hp > lastHp ? '+' : '') + (p.hp - lastHp), p.hp > lastHp ? 'heal' : 'dmg');
    lastHp = p.hp;

    // actions
    const acts = v.actions || [];
    $('actions').innerHTML = acts.map(a => `<button class="btn ${BTN_CLASS(a.id)} ${acts.length === 1 ? 'wide' : ''}" data-id="${esc(a.id)}" ${a.disabled ? 'disabled' : ''}>${btnLabel(a.label)}</button>`).join('')
      || `<button class="btn wide" disabled>Данж закрыт до завтра</button>`;
    $('actions').querySelectorAll('button[data-id]').forEach(b => b.addEventListener('click', () => act(b.dataset.id)));

    // end screen
    const end = $('end');
    if (v.phase === 'dead' || v.phase === 'won') {
      const won = v.phase === 'won';
      end.innerHTML = `<div class="big">${won ? '👑' : '💀'}</div><h2>${won ? 'МИНИ-ПУДЖИК ПОБЕЖДЁН' : 'ВЫ ПОГИБЛИ'}</h2>
        <div>${won ? 'Все 10 комнат пройдены. Завтра — новый данж.' : `Пройдено комнат: ${v.rooms_cleared} из ${v.rooms_total}. Завтра — новый данж.`}</div>
        <div class="others">${(payload.others || []).map(o => `<div>${esc(o.line)}</div>`).join('')}</div>
        ${payload.boss ? `<div class="boss">ПУДЖИНИО-ФАМОЗА ${payload.boss.hp}/${payload.boss.max_hp} HP${payload.boss.rage ? ' · ЯРОСТЬ' : ''}</div>` : ''}`;
      end.classList.remove('hidden'); $('stage').classList.add('hidden'); $('msg').classList.add('hidden'); en.classList.add('hidden');
      if (tg) try { tg.HapticFeedback.notificationOccurred(won ? 'success' : 'error'); } catch(e){}
    } else { end.classList.add('hidden'); $('stage').classList.remove('hidden'); $('msg').classList.remove('hidden'); }
  }

  // ── intro sequence ──
  let introTimers = [], introDone = false;
  function playIntro(date, mod){
    const box = $('intro'); box.classList.remove('hidden');
    if (mod && mod.key && mod.key !== 'none') $('il3').textContent = `Правило дня — ${mod.name}: ${mod.desc}`;
    const title = 'ДАНЖ ПУДЖИНИО';
    $('introTitle').innerHTML = [...title].map((ch, i) => `<span class="c" style="animation-delay:${1.0 + i * 0.11}s">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('');
    $('il4').textContent = date || '';
    const t = (ms, fn) => introTimers.push(setTimeout(fn, ms));
    t(3000, () => $('il1').classList.add('on'));
    t(4600, () => $('il2').classList.add('on'));
    t(6200, () => $('il3').classList.add('on'));
    t(7400, () => $('il4').classList.add('on'));
    t(8200, () => $('itap').classList.add('on'));
    t(14000, openGates);
    box.addEventListener('click', openGates);
    if (tg) try { tg.HapticFeedback.impactOccurred('medium'); } catch(e){}
  }
  function openGates(){
    if (introDone) return; introDone = true;
    introTimers.forEach(clearTimeout);
    const box = $('intro'); box.classList.add('open');
    if (tg) try { tg.HapticFeedback.notificationOccurred('warning'); } catch(e){}
    setTimeout(() => box.classList.add('hidden'), 1200);
  }

  function fail(msg){ $('app').innerHTML = `<div class="err">${esc(msg)}</div>`; }
  async function load(){
    try {
      const res = await fetch('/miniapp/api/dungeon/state?init_data=' + encodeURIComponent(initData));
      const data = await res.json();
      if (!data.success) return fail(data.error === 'invalid_auth' ? 'Открой данж кнопкой в боте Telegram.' : 'Не удалось загрузить данж. Попробуй открыть его ещё раз.');
      if (data.data.is_new || location.search.includes('intro')) playIntro(data.data.date, data.data.view && data.data.view.modifier);
      render(data.data);
    } catch (e) { fail('Данж не отвечает. Попробуй открыть его чуть позже.'); }
  }
  async function act(action){
    if (busy) return; busy = true;
    $('actions').querySelectorAll('button').forEach(b => b.classList.add('busy'));
    if (tg) try { tg.HapticFeedback.impactOccurred('light'); } catch(e){}
    try {
      const res = await fetch('/miniapp/api/dungeon/act', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ init_data: initData, action }) });
      const data = await res.json(); if (data.success) render(data.data);
    } catch (e) { console.error(e); }
    busy = false;
  }
  load();
})();
</script>
</body>
</html>
